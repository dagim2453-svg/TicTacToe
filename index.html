<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TicTacToe</title>
    <style>
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
      }
      .container {
        width: 75vw;
        padding: 1rem;
        border: 1px solid rgb(91, 151, 155);
        border-radius: 4px;
      }
      .container .heading {
        display: flex;
        justify-content: center;
      }
      .container .heading h2 {
        color: rgb(21, 63, 50);
        border-bottom: 1px solid rgb(48, 104, 86);
      }
      .grid-container {
        display: grid;
        justify-content: center;
        gap: 0.5rem;
        grid-template-columns: repeat(3, 100px);
        grid-template-rows: repeat(3, 100px);
      }
      .grid-container .box {
        width: 100%;
        height: 100%;
        color: white;
        font-size: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        border: 1px solid transparent;
        border-radius: 4px;
        background-color: rgb(36, 75, 62);
      }
      .container .box:hover {
        cursor: pointer;
        background-color: rgb(48, 104, 86);
      }
      .game-status {
        margin-top: 0.5rem;
        color: rgb(46, 26, 1);
        font-weight: bold;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="heading">
        <h2>TicTacToe</h2>
      </div>

      <div class="grid-container">
        <!-- <div class="box box1">X</div>
        <div class="box box2">X</div>
        <div class="box box3">0</div>
        <div class="box box4">X</div>
        <div class="box box5">X</div>
        <div class="box box6">0</div>
        <div class="box box7">?</div>
        <div class="box box8">?</div>
        <div class="box box9">0</div> -->
      </div>
      <div class="game-status"></div>
    </div>
    <script src="/script.js" def></script>
  </body>
</html>
