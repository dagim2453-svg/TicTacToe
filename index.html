<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TicTacToe</title>
    <style>
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
      }
      .container {
        width: 75vw;
        padding: 1rem;
        border: 1px solid rgb(91, 151, 155);
        border-radius: 4px;
        display: grid;
        justify-content: center;
        gap: 0.5rem;
        grid-template-columns: repeat(3, 100px);
        grid-template-rows: repeat(3, 100px);
      }
      .container .box {
        width: 100%;
        height: 100%;
        color: white;
        font-size: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: bold;
        border: 1px solid transparent;
        border-radius: 4px;
        background-color: rgb(36, 75, 62);
      }
      .container .box:hover {
        cursor: pointer;
        background-color: rgb(48, 104, 86);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box box1">X</div>
      <div class="box box2">X</div>
      <div class="box box3">0</div>
      <div class="box box4">X</div>
      <div class="box box5">X</div>
      <div class="box box6">0</div>
      <div class="box box7">?</div>
      <div class="box box8">?</div>
      <div class="box box9">0</div>
    </div>
  </body>
</html>
